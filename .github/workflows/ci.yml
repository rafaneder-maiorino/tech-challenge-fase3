name: CI

# Runs on every push to main and on every pull request targeting it. Pull
# request runs are what gate a merge; the push run re-validates main after it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run obsolete; cancelling it
# keeps the queue short without losing signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.9.9"

jobs:
  # --------------------------------------------------------------------
  # Static verification. Runs in parallel with 'test'.
  # --------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0  # no floating major tag is published; pinned exactly
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # Keyed on uv.lock, so the cache is reused until dependencies
          # actually change. The suffix keeps this job's cache distinct from
          # the 'test' job's: the two run in parallel and would otherwise race
          # to reserve the same key, and they install different sets anyway.
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: lint

      # Only the dev group: ruff needs neither the project nor its runtime
      # dependencies, so linting does not pay for scikit-learn.
      - name: Install lint dependencies
        run: uv sync --frozen --only-group dev

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  # --------------------------------------------------------------------
  # Test suite. Runs in parallel with 'lint'.
  # --------------------------------------------------------------------
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0  # no floating major tag is published; pinned exactly
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: test

      # --all-extras installs both serving backends, because the API contract
      # suite now runs against each of them. The 'train' group comes back in
      # too: the ONNX fixture is exported through src.models.export_onnx, so
      # the suite needs skl2onnx to build it.
      - name: Install test dependencies
        run: uv sync --frozen --all-extras

      # Coverage is scoped to src/api because that is what this suite tests:
      # an API contract suite, not a model-quality suite. The data and training
      # modules are exercised for real by the 'build' job, which runs the full
      # download + train + export pipeline inside the image.
      - name: pytest
        run: |
          uv run --no-sync pytest -v \
            --cov=src/api \
            --cov-report=term-missing

  # --------------------------------------------------------------------
  # Image build plus smoke test. Only worth running once the code is known
  # to lint and pass its tests, so it waits on both.
  # --------------------------------------------------------------------
  build:
    name: build (docker + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      # No layer cache on purpose. The cold build measures at ~27 s on this
      # runner, of which download + train is ~15 s, so caching would buy little
      # while risking a run that ships a stale model instead of proving the
      # training path still works. See README, section 5.2.
      - name: Build image
        run: docker build -t tc-fase3-api:ci .

      - name: Start container
        run: docker run -d --name tc-api -p 8000:8000 tc-fase3-api:ci

      # Readiness, not just liveness: the API answers /health even when the
      # model failed to load, reporting model_loaded=false. That has to fail.
      - name: Wait for /health to report the model loaded
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8000/health 2>/dev/null || true)
            if [ -n "$body" ] && echo "$body" | grep -q '"model_loaded":true'; then
              echo "ready after ${attempt}s: $body"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not report model_loaded=true within 30s"
          echo "last response: ${body:-<none>}"
          docker logs tc-api
          exit 1

      # Proves the artifact trained during the build actually serves: a valid
      # prediction is one of the five labels the service is allowed to return.
      - name: Smoke test /predict
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"text":"Acute myocardial infarction treated with coronary angioplasty."}')
          echo "$response"
          echo "$response" | grep -qE '"label":[1-5]' || {
            echo "::error::/predict did not return a label in 1..5"
            docker logs tc-api
            exit 1
          }

      # A instrumentação só vale se ela chega até o container. Este passo roda
      # depois do smoke test de /predict de propósito: a predição feita ali
      # tem de aparecer no contador por classe, o que prova que a métrica está
      # ligada ao handler e não apenas declarada no módulo.
      - name: Smoke test /metrics
        run: |
          metrics=$(curl -fsS http://localhost:8000/metrics)

          echo "$metrics" | grep -q '^# TYPE api_requests_total counter' || {
            echo "::error::/metrics não devolveu o formato de exposição do Prometheus"
            echo "$metrics" | head -20
            exit 1
          }

          echo "$metrics" | grep -q '^api_model_loaded 1\.0$' || {
            echo "::error::api_model_loaded não está em 1 com o modelo carregado"
            echo "$metrics" | grep api_model_loaded
            exit 1
          }

          echo "$metrics" | grep -qE '^api_predictions_total\{label="[1-5]".*\} [1-9]' || {
            echo "::error::a predição do passo anterior não foi contabilizada por classe"
            echo "$metrics" | grep api_predictions_total
            exit 1
          }

          echo "$metrics" | grep -q 'api_request_duration_seconds_bucket{endpoint="/predict"' || {
            echo "::error::o histograma de latência não registrou /predict"
            exit 1
          }

          echo "métricas expostas e populadas:"
          echo "$metrics" | grep -E '^api_(model_loaded|predictions_total)'

      # ------------------------------------------------------------------
      # ONNX runtime image (phase 4). Built here rather than in its own job
      # so the two images are measured on the same runner, which is the only
      # way the size comparison means anything.
      # ------------------------------------------------------------------
      - name: Build ONNX image
        run: docker build -f Dockerfile.onnx -t tc-fase3-api:ci-onnx .

      - name: Start ONNX container
        run: docker run -d --name tc-api-onnx -p 8001:8000 tc-fase3-api:ci-onnx

      - name: Wait for the ONNX container to report the model loaded
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8001/health 2>/dev/null || true)
            if [ -n "$body" ] && echo "$body" | grep -q '"model_loaded":true'; then
              echo "ready after ${attempt}s: $body"
              echo "$body" | grep -q '"model_backend":"onnx"' || {
                echo "::error::container reports a backend other than onnx"
                exit 1
              }
              exit 0
            fi
            sleep 1
          done
          echo "::error::ONNX /health did not report model_loaded=true within 30s"
          echo "last response: ${body:-<none>}"
          docker logs tc-api-onnx
          exit 1

      # Both containers are up, so the same input can be sent to each. The
      # labels have to match: the ONNX graph is an export of the very model
      # the other container loaded, and a mismatch here means the export is
      # stale or wrong, which the equivalence report alone would not catch.
      - name: Both backends agree on the same input
        run: |
          payload='{"text":"Acute myocardial infarction treated with coronary angioplasty."}'
          sklearn=$(curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d "$payload")
          onnx=$(curl -fsS -X POST http://localhost:8001/predict \
            -H 'Content-Type: application/json' -d "$payload")
          echo "sklearn: $sklearn"
          echo "onnx   : $onnx"

          label_of() { echo "$1" | sed -n 's/.*"label":\([0-9]*\).*/\1/p'; }
          a=$(label_of "$sklearn"); b=$(label_of "$onnx")
          case "$b" in [1-5]) ;; *) echo "::error::ONNX returned no valid label"; exit 1 ;; esac
          [ "$a" = "$b" ] || {
            echo "::error::backends disagree: sklearn=$a onnx=$b"
            exit 1
          }
          echo "ambos classificaram como label=$a"

      # The deliverable of this phase. Printed to the summary so the number is
      # visible without digging through logs.
      - name: Report image sizes
        run: |
          sk=$(docker images tc-fase3-api:ci --format '{{.Size}}')
          on=$(docker images tc-fase3-api:ci-onnx --format '{{.Size}}')
          sk_b=$(docker image inspect tc-fase3-api:ci --format '{{.Size}}')
          on_b=$(docker image inspect tc-fase3-api:ci-onnx --format '{{.Size}}')
          delta=$(awk "BEGIN{printf \"%.1f\", 100*($on_b-$sk_b)/$sk_b}")
          {
            echo "### Tamanho das imagens"
            echo ""
            echo "| Runtime | docker images | bytes |"
            echo "|---|---|---|"
            echo "| sklearn | $sk | $sk_b |"
            echo "| onnx | $on | $on_b |"
            echo ""
            echo "Variação: **${delta}%**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sklearn=$sk ($sk_b B) | onnx=$on ($on_b B) | ${delta}%"

      # Proves the claim rather than trusting the uv flags: if scikit-learn or
      # scipy ever leak back into the ONNX runtime, the size gain is gone and
      # this step is what says so.
      - name: ONNX runtime carries no scikit-learn or scipy
        run: |
          packages=$(docker run --rm --entrypoint sh tc-fase3-api:ci-onnx \
            -c 'ls /opt/venv/lib/python3.11/site-packages')
          echo "$packages" | tr '\n' ' '
          for forbidden in sklearn scipy joblib pandas; do
            echo "$packages" | grep -qx "$forbidden" && {
              echo "::error::$forbidden presente no runtime ONNX"
              exit 1
            }
          done
          echo "$packages" | grep -qx onnxruntime || {
            echo "::error::onnxruntime ausente no runtime ONNX"
            exit 1
          }
          echo "OK: runtime ONNX sem sklearn/scipy/joblib/pandas"

      - name: Container logs
        if: always()
        run: |
          docker logs tc-api || true
          docker logs tc-api-onnx || true

      - name: Stop containers
        if: always()
        run: docker rm -f tc-api tc-api-onnx || true
