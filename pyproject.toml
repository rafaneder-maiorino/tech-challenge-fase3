[project]
name = "tech-challenge-fase3"
version = "0.1.0"
description = "Triagem de laudos médicos — Tech Challenge FIAP Fase 3"
readme = "README.md"
requires-python = ">=3.11"
# Only what BOTH serving backends need. The inference engine is an extra, not
# a base dependency: that is what lets the ONNX runtime image be built without
# scikit-learn and scipy ever entering it. Training libraries live in the
# 'train' group.
dependencies = [
    "fastapi>=0.139.2",
    "prometheus-client>=0.24.1",
    "uvicorn[standard]>=0.51.0",
]

# One extra per serving backend, selected by MODEL_BACKEND at runtime and by
# `uv sync --extra <name>` at image build time. They are deliberately disjoint:
# installing 'onnx' must not drag in scikit-learn, or the whole point of the
# smaller image is lost.
[project.optional-dependencies]
sklearn = [
    "joblib>=1.5.3",
    "scikit-learn>=1.9.0",
]
onnx = [
    "onnxruntime>=1.24.0",
]

[dependency-groups]
train = [
    "huggingface-hub>=1.24.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "skl2onnx>=1.20.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
# Local development gets every group; the Docker runtime stages opt out with
# --no-default-groups.
#
# Extras are NOT covered by this: uv 0.11 has no `default-extras`, so a bare
# `uv sync` installs neither backend and the test suite cannot import either.
# Local development and CI therefore use `uv sync --all-extras`; the images use
# `--extra sklearn` or `--extra onnx`. See docs/optimization.md, section 3.
default-groups = ["dev", "train"]

[tool.ruff]
# 88 is what the existing code was already written to; ruff format and the
# E501 lint rule share this number so the two never disagree.
line-length = 88
target-version = "py311"
# docs/ holds verbatim transcriptions of the course PDFs. Ruff formats Python
# blocks inside Markdown, which would silently rewrite quoted material, so the
# whole directory is off limits.
extend-exclude = [".venv-extract", "data", "docs", "models", "reports"]

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9 + F): import order, modernisation, bug
# patterns, comprehension and naming hygiene, plus docstring presence on the
# public surface. Deliberately not the full rule set — the point is a gate
# that catches real defects, not a style debate in code review.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "D",    # pydocstyle
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # conflicts with D211 (blank line before class docstring)
    "D213",  # conflicts with D212 (summary on the second line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names and fixtures document themselves; a docstring per assertion adds
# noise without adding information.
"tests/**" = ["D103"]
# Throwaway inspection and extraction utilities, not part of the delivered
# pipeline.
"scripts/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
