# Stack mínima do Apache Airflow para o Tech Challenge - Fase 3, Etapa 2.
#
# Executor: LocalExecutor (ver justificativa em docs/airflow-setup.md).
# Componentes: postgres (metadata DB) + airflow-init (one-shot) + scheduler + webserver.
#
# Uso (a partir deste diretório):
#   docker compose -f docker-compose.airflow.yml up -d
#   docker compose -f docker-compose.airflow.yml down
#
# As imagens são multi-arch; em Apple Silicon rodam nativamente em arm64,
# sem emulação QEMU. Por isso `platform:` NÃO é fixado — o mesmo arquivo
# funciona em amd64 (CI, colegas de grupo em Linux/Windows).

x-airflow-common: &airflow-common
  # Versão fixada explicitamente (nunca :latest) para builds reprodutíveis.
  # python3.11 casa com o .python-version do projeto, o que evita surpresas
  # quando as DAGs passarem a importar código de src/.
  image: apache/airflow:2.11.0-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    # Requisito da tarefa: sem as ~50 DAGs de exemplo poluindo a UI.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # DAGs novas nascem pausadas: evita disparar treino sem querer no primeiro up.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Chaves fixas para desenvolvimento local. Se ficarem vazias, o Airflow gera
    # uma nova a cada restart e as Connections salvas deixam de descriptografar.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-x-nBzJo2vtDUDCV_iu5FFenIobfbUgDLUqkxoGEplCE=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-4fa8498ca135f72f6a416bbe40cad4eb}
    # Expõe /health do scheduler para o healthcheck do container.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
  # UID do processo dentro do container; grupo 0 (root) porque a imagem do
  # Airflow é OpenShift-compatible e dá permissão de escrita ao grupo 0.
  # Em macOS o padrão 50000 é o correto — ver docs/airflow-setup.md.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    # Sem `ports:` de propósito: o banco só é acessado pela rede interna do
    # compose. Assim não há risco de conflito com um Postgres local na 5432.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Serviço one-shot: roda as migrations e cria o usuário admin. Os demais
  # serviços só sobem depois que este termina com sucesso.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com \
          || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    # Roda como root para conseguir ajustar dono dos diretórios montados em
    # hosts Linux. Em macOS o Docker Desktop já mapeia o dono automaticamente.
    user: "0:0"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Host 8080 -> container 8080. A API do projeto usa 8000 (ver Dockerfile),
      # então não há conflito. Override: AIRFLOW_WEB_PORT=8081 docker compose ...
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-db-volume:
